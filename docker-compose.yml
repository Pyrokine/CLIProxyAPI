services:
    cli-proxy-api:
        image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
        pull_policy: always
        build:
            context: .
            dockerfile: Dockerfile
            args:
                VERSION: ${VERSION:-dev}
                COMMIT: ${COMMIT:-none}
                BUILD_DATE: ${BUILD_DATE:-unknown}
        container_name: cli-proxy-api
        # env_file:
        #   - .env
        environment:
            DEPLOY: ${DEPLOY:-}
        ports:
            - "8317:8317"
            - "8085:8085"
            - "1455:1455"
            - "54545:54545"
            - "51121:51121"
            - "11451:11451"
        command: [ "./CLIProxyAPI", "--config", "/CLIProxyAPI/config/config.yaml" ]
        volumes:
            # Mount the directory so atomic config replacement and last-good backups work.
            # Set CLI_PROXY_CONFIG_DIR=. to keep using a legacy root-level config.yaml.
            - ${CLI_PROXY_CONFIG_DIR:-./config}:/CLIProxyAPI/config
            - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
            - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
            - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
        restart: unless-stopped
