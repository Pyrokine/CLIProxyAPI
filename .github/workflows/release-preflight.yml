name: release-preflight

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # noinspection UndefinedAction
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        # noinspection UndefinedAction
        uses: actions/setup-go@v7.1.0
        with:
          # noinspection UndefinedParamsPresent
          go-version-file: go.mod
          # noinspection UndefinedParamsPresent
          cache: true
      - name: Release contracts
        run: go -C cmd/server test -count=1 release_contract_test.go
      - name: Validate GoReleaser configuration
        # noinspection UndefinedAction
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          # noinspection UndefinedParamsPresent
          distribution: goreleaser
          # noinspection UndefinedParamsPresent
          version: v2.20.2
          # noinspection UndefinedParamsPresent
          args: check
