name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    uses: ./.github/workflows/release-preflight.yml
    permissions:
      contents: read

  build:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # noinspection UndefinedAction
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        # noinspection UndefinedAction
        uses: actions/setup-go@v7.1.0
        with:
          # noinspection UndefinedParamsPresent
          go-version-file: go.mod
          # noinspection UndefinedParamsPresent
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
