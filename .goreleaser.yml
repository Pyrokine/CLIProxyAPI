version: 2

builds:
    -   id: "cli-proxy-api"
        env:
            - CGO_ENABLED=0
        goos:
            - linux
            - windows
            - darwin
        goarch:
            - amd64
            - arm64
        main: ./cmd/server/
        binary: cli-proxy-api
        ldflags:
            - -s -w -X 'main.version={{.Version}}' -X 'main.commit={{.FullCommit}}' -X 'main.buildDate={{.Date}}' -X 'github.com/Pyrokine/CLIProxyAPI/v6/internal/buildinfo.UpdateProtocol=2'
archives:
    -   id: "cli-proxy-api"
        formats:
            - tar.gz
        format_overrides:
            -   goos: windows
                formats:
                    - zip
        files:
            - LICENSE
            - README.md
            - README_CN.md
            - config.example.yaml

checksum:
    name_template: 'checksums.txt'

snapshot:
    version_template: "{{ incpatch .Version }}-next"

changelog:
    sort: asc
    filters:
        exclude:
            - '^docs:'
            - '^test:'
