# OAuth provider request-scoped error rules
# Rules are evaluated in order; the first valid match wins.
# Actions:
#   stop: stop fallback without changing availability
#   stop-and-cooldown: stop fallback and force cooldown
#   continue: continue only when replay is already safe
#   continue-and-cooldown: continue when safe and force cooldown
# oauth-request-scoped-errors:
#   vertex:
#     - status: 400
#       match:
#         - "maximum_context_length"
#         - "context_length_exceeded"
#       match-regexr:
#         - "maximum_context_length$"
#         - "^context_length_exceeded"
#       action: "stop"

