# Vertex API keys (Vertex-compatible endpoints, use API key + base URL)
# vertex-api-key:
#   - api-key: "vk-123..."                        # x-goog-api-key header
#     prefix: "test"                # optional: require calls like "test/vertex-pro"
#                                    # to target this credential
#     request-retry: 3               # optional: 0 disables retries; omit or set < 0 to use the global value
#     base-url: "https://example.com/api"         # e.g. https://zenmux.ai/api
#     proxy-url: "socks5://proxy.example.com:1080" # optional per-key proxy override
#     headers:
#       X-Custom-Header: "custom-value"
#     models:                                     # optional: map aliases to upstream model names
#       - name: "gemini-2.5-flash"                # upstream model name
#         alias: "vertex-flash"                   # client-visible alias
#         display-name: "Vertex Flash"            # optional catalog display name
#         thinking:                                # optional: exact thinking capability for this configured model
#           levels: ["high", "medium", "low", "none", "auto"]
#       - name: "gemini-2.5-pro"
#         alias: "vertex-pro"

# Global OAuth model name aliases (per channel)
# These aliases rename model IDs for both model listing and request routing.
# Supported channels: gemini-cli, vertex, aistudio, antigravity, claude, codex, qwen, iflow, kimi, xai, meta.
# NOTE: Aliases do not apply to gemini-api-key, codex-api-key, claude-api-key,
# openai-compatibility and vertex-api-key.
# You can repeat the same name with different aliases to expose multiple client model names.
# Set force-mapping when the upstream response returns the original model name but clients should see the alias.
# oauth-model-alias:
#   gemini-cli:
#     - name: "gemini-2.5-pro"          # original model name under this channel
#       alias: "g2.5p"                  # client-visible alias
#       fork: true                      # when true, keep original and also add the alias
#                                       # as an extra model (default: false)
#       force-mapping: true             # rewrite response model fields back to the alias
#   vertex:
#     - name: "gemini-2.5-pro"
#       alias: "g2.5p"
#   aistudio:
#     - name: "gemini-2.5-pro"
#       alias: "g2.5p"
#   antigravity:
#     - name: "gemini-3-pro-high"
#       alias: "gemini-3-pro-preview"
#   claude:
#     - name: "claude-sonnet-4-5-20250929"
#       alias: "cs4.5"
#   codex:
#     - name: "gpt-5"
#       alias: "g5"
#       display-name: "GPT-5 OAuth" # optional catalog display name
#   qwen:
#     - name: "qwen3-coder-plus"
#       alias: "qwen-plus"
#   iflow:
#     - name: "glm-4.7"
#       alias: "glm-god"
#   kimi:
#     - name: "kimi-k2.5"
#       alias: "k2.5"
#   qoder:                            # plugin provider keys are supported for OAuth plugins
#     - name: "qmodel_latest"
#       alias: "qlatest"
# Per-auth OAuth/token JSON uses the canonical "model_aliases" key; legacy "model-aliases" remains readable.
# Example: {"type":"codex","email":"user@example.com","model_aliases":[{"name":"gpt-5.3-codex-spark","alias":"gpt-5.5"}]}

