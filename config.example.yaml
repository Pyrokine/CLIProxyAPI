#       - "claude-3-*"               # wildcard matching prefix (e.g. claude-3-7-sonnet-20250219)
#       - "*-thinking"               # wildcard matching suffix (e.g. claude-opus-4-5-thinking)
#       - "*haiku*"                  # wildcard matching substring (e.g. claude-3-5-haiku-20241022)
#     rebuild-mid-system-message: false # optional: move messages with role "system" into top-level Claude system
#     cloak:                         # optional: request cloaking for non-Claude-Code clients
#       mode: "auto"                 # "auto" (default): cloak only when client is not Claude Code
#                                    # "always": always apply cloaking
#                                    # "never": never apply cloaking
#       strict-mode: false           # false (default): prepend Claude Code prompt to user system messages
#                                    # true: strip all user system messages, keep only Claude Code prompt
#       sensitive-words:             # optional: words to obfuscate with zero-width characters
#         - "API"
#         - "proxy"
#       cache-user-id: true          # optional: default is false; set true to reuse cached
#                                    # user_id per API key instead of generating a random
#                                    # one each request
#     fingerprint-profile: ""       # 默认为空，API key 保留调用方身份
#                                    # claude-code-cli 启用 CLI 请求身份，oauth-cli 为兼容名称
#                                    # 不改变真实 OAuth 行为或增加账号权限
#     # OAuth/token JSON uses fingerprint_profile; the legacy fingerprint-profile spelling remains readable.
#     # Set fingerprint_profile only for a profile supported by the credential.
#     experimental-cch-signing: false # 仅兼容旧配置，不能开启签名

# Optional CLI/OAuth profile overrides. Empty values keep the built-in profile or the caller's headers.
# claude-header-defaults:
#   user-agent: ""      # CLI baseline: claude-cli/2.1.280 (external, cli).
#   package-version: "" # CLI baseline: 0.112.1.
#   runtime-version: "" # CLI baseline: v26.3.0.
#   os: ""             # Stabilized baseline: MacOS. Otherwise keep the caller or host OS.
#   arch: ""           # Stabilized baseline: arm64. Otherwise keep the caller or host architecture.
#   timeout: ""        # CLI request header fallback: "600".
#   timezone: ""       # Use the server's timezone unless the credential supplies a timezone.
#   stabilize-device-profile: false # Optional. Omission also leaves the caller's platform unstabilized.

# Optional Codex OAuth header overrides. Empty uses the normal client or built-in headers.
# codex-header-defaults:
#   user-agent: ""
#   beta-features: "" # WebSocket beta feature header; empty adds no configured features.

# OpenAI compatibility providers
# openai-compatibility:
