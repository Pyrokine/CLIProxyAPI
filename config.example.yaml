# Server host/interface to bind to. Default is "127.0.0.1" for local-only access.
# Use "0.0.0.0" to bind all IPv4 interfaces if remote access is needed.
host: "127.0.0.1"
# Use a fixed port for the server and management clients. Omission loads 0 (OS-assigned port in local mode).
port: 8317
# TLS settings for HTTPS. When enabled, the server listens with the provided certificate and key.
tls:
    enable: false
    cert: ""
    key: ""
    # Optional HTTP listener for HTTPS redirects. Set to 80 for the standard HTTP port.
    http-redirect-port: 0
    # Reject plaintext requests to authenticated HTTP endpoints and Redis usage output.
    # Direct loopback clients that are not configured as proxies remain allowed.
    require-for-auth: false
    # Accept X-Forwarded-Proto only from peers listed in remote-management.trusted-proxies.
    # Keep false when CPA does not sit behind a TLS-terminating reverse proxy.
    trust-forwarded-proto: false
# Management API settings
remote-management:
    # Whether to allow remote (non-localhost) management access.
    # When false, only localhost can access management endpoints (a key is still required).
    allow-remote: false
    # Direct reverse-proxy IP addresses or CIDR ranges whose X-Forwarded-For/X-Real-IP
    # headers may identify clients for API and management authentication.
    # Leave empty when CPA is exposed directly. Full-network CIDRs are rejected.
    # Example for a local Nginx proxy: ["127.0.0.1/32", "::1/128"]
    trusted-proxies: [ ]
    # Management key for panel sign-in and direct API clients. CPA hashes plaintext on startup.
    # The browser uses a 30-minute session after sign-in. Scripts and TUI can still send the key directly.
    # Leave empty to disable the Management API entirely (404 for all /v0/management routes).
    secret-key: ""
    # Disable the bundled management control panel asset download and HTTP route when true.
    disable-control-panel: false
    # Disable automatic management panel asset updates while keeping the panel route enabled.
    # If omitted, the legacy auto-update-panel flag applies; when both are unset, updates are enabled.
    disable-auto-update-panel: false
    # GitHub repository for the management control panel. Accepts a repository URL or releases API URL.
    panel-github-repository: "https://github.com/Pyrokine/Cli-Proxy-API-Management-Center"
    # GitHub repository for CPA backend releases.
    cpa-github-repository: "https://github.com/Pyrokine/CLIProxyAPI"
    # Periodically check GitHub for newer panel/backend releases.
    auto-check-update: false
    # Automatically install the CPA backend when auto-check-update finds a newer release.
    auto-update-cpa: false
    # Automatic update checks use 180 minutes by default; values below 30 also use 180.
    check-interval: 180
# Override management panel static directory with MANAGEMENT_STATIC_PATH environment variable.
# If set, the server will look for management.html in the specified path instead of the default location.
# Example: MANAGEMENT_STATIC_PATH=/opt/cpa/static
# Local auth directory. Empty uses ~/.cli-proxy-api, resolved under the running user's home directory.
auth-dir: "~/.cli-proxy-api"
# Client authentication keys. These template values keep local CPA in setup mode with proxy requests disabled.
# Replace them with your own client keys before sending proxy requests.
api-keys:
    - "your-api-key-1"
    - "your-api-key-2"
    - "your-api-key-3"
# Use an existing client key as the map key. Empty maps set no display aliases or access/usage rules.
api-key-aliases: { }
api-key-rules: { }
# api-key-aliases:
#   "<client-key>": "Team name" # Omission leaves the key unnamed.
# api-key-rules:
#   "<client-key>":
#     blocked-models: []         # Empty blocks no model patterns.
#     providers: []              # Empty allows all providers.
#     canonical-models: []       # Empty allows all models not otherwise blocked.
#     model-mappings: {}         # Client model ID -> routed model ID; empty leaves names unchanged.
#     policy-profile: "default"  # Optional name for persistent usage limits.
#     reservation-ttl: "24h"     # Optional lifetime of a usage reservation.
#     limits:                    # Omit to apply no persistent usage limits.
#       - window: "1h"           # Required positive duration, unique within this key's limits.
#         requests: 500          # At least one of requests, tokens and cost-micro must be positive.
#         tokens: 0              # 0 applies no limit to this dimension.
#         cost-micro: 0          # Cost in millionths of a US dollar; 0 applies no cost limit.
# Codex 客户端工具能力，关闭时模型目录不声明 apply_patch
client:
    codex:
        enable-apply-patch: false
# Enable debug logging.
debug: false
# Write per-request logs. Keep false unless you need request traces.
request-log: false
# Enable pprof HTTP debug server (host:port). Keep it bound to localhost for safety.
pprof:
    enable: false
    addr: "127.0.0.1:8316"
# Standard dynamic library plugins are trusted in-process code. They are disabled by default.
# Build Go examples with go build -buildmode=c-shared for the target GOOS/GOARCH.
# Other languages can implement the same C ABI and JSON method protocol.
# Plugin executors require a matching auth record with the same provider key.
# If the same provider is configured as OpenAI-compatible, the native executor wins.
# Plugin command-line flags and Management API routes are optional capabilities.
# The plugin list Management API reads plugin Metadata Logo and ConfigFields for panel display.
# Per-plugin enabled only controls plugins.configs.<pluginID>.enabled; it does not change global plugins.enabled.
plugins:
    enabled: false
    dir: "plugins"
    # Additional registry URLs (for example, https://registry.example.invalid/plugins.json) follow the official source.
    store-sources: [ ]
    # No authenticated store requests by default. Each rule requires a matching URL prefix.
    # Set environment variable names here; keep their secret values in the environment.
    store-auth: [ ]
    # store-auth:
    #   - match: "https://registry.example.invalid/private/"
    #     apply-to: [] # Omit or leave empty for registry, metadata, and artifact requests.
    #     type: "none" # Default. Also accepts bearer, github-token, basic, and header.
    #     token-env: "" # Required for bearer and github-token.
    #     username-env: "" # Required for basic.
    #     password-env: "" # Required for basic.
    #     header-name: "" # Required for header.
    #     header-value-env: "" # Required for header.
    #     allow-insecure: false # Keep false to send configured credentials only over HTTPS.
    # Home supplies auth-revision when it manages plugin credentials.
    configs: { }
    # configs:
    #   "<installed-plugin-id>": # Use the ID shown on the Plugins page.
    #     enabled: false         # Enable this plugin only when plugins.enabled is true.
    #     priority: 0            # Default startup and routing priority.
    # Add other settings under that ID using the installed plugin's field list.
# When true, disable high-overhead HTTP middleware features to reduce per-request memory usage under high concurrency.
commercial-mode: false
# When true, disable Claude Code cloak mode globally for all Claude credentials.
disable-claude-cloak-mode: false

# Claude Code compatibility settings.
claude-code:
    # When true, return original model IDs in Anthropic model list responses instead of cloaked IDs.
    disable-cloaking-model-list: false

# When true, write application logs to rotating files instead of stdout
logging-to-file: false
# Maximum total size (MB) of log files under the logs directory. When exceeded, the oldest log
# files are deleted until within the limit. Set to 0 to disable.
logs-max-total-size-mb: 0
# Maximum number of error log files retained when request logging is disabled.
# When exceeded, the oldest error log files are deleted. Default is 10. Set to 0 to disable cleanup.
error-logs-max-files: 10
# When false, disable in-memory usage statistics aggregation
usage-statistics-enabled: false
# Empty uses WRITABLE_PATH/usage-data, then usage-data beside config.yaml.
usage-data-dir: ""
# Legacy flag: "disabled" prevents persistence. Other values leave the path selection unchanged.
# usage-statistics-file: ""

# Usage retention deletes old events and rebuilds aggregate statistics in the same transaction.
usage-retention:
    days: 0                  # 0 uses the default (-1, keep history). Set a positive number of days to expire events.
    max-db-size-mb: 0         # 0 disables the SQLite write cap (events.db + WAL + SHM).
    warning-threshold-pct: 0 # 0 uses 80%. Applies only when max-db-size-mb is positive.

# Disk cleanup for generated image artifacts. Either limit can be disabled with 0.
image-artifact-cache:
    retention-days: 7
    max-total-size-mb: 10240

# Proxy URL. Supports socks5/http/https protocols. Example: socks5://user:pass@192.168.1.1:1080/
proxy-url: ""
# When true, unprefixed model requests only use credentials without a prefix (except when prefix == model name).
force-model-prefix: false
# When true, enable Gemini CLI internal endpoints (`/v1internal:*`).
# Default is false for safety.
enable-gemini-cli-endpoint: false
# When true, forward filtered upstream response headers to downstream clients.
# Default is false (disabled).
passthrough-headers: false
# Extra attempts after a failed request. Omission defaults to 0; this sample opts into 3 retries.
# Provider API-key rows can override it with request-retry; auth files use request_retry.
# A credential value of 0 disables extra attempts. Omit it or set a negative value to inherit this global count.
request-retry: 3
# Maximum number of credentials to try for one failed request. 0 lets CPA try all available credentials.
max-retry-credentials: 0
# Maximum cooldown wait before a retry, in seconds. Omission defaults to 0 (no wait).
max-retry-interval: 30
# When true, disable cooldown scheduling globally. An omitted per-credential setting inherits this value.
disable-cooling: false
# When true, persist runtime cooldown status independently of auth credentials.
# PostgreSQL-backed auth stores use their cooldown table; file stores use per-auth .cds files.
save-cooldown-status: false
# 临时上游错误的冷却时长，单位为秒，0 使用默认 60 秒，负数停用
# 启用时优先使用供应商有效的 Retry-After，正值最多为 9223372036 秒
transient-error-cooldown-seconds: 0
# Concurrent OAuth refresh workers. 0 or a negative value uses 16 workers.
auth-auto-refresh-workers: 0

# Home supplies authoritative credential lifecycle values. Leave the revisions to Home.
# credential-concurrency:
#   lifecycle-config-revision:   # Assigned by Home; present revisions must be positive.
#   observation-barrier-revision: 0 # Unset/0 means no barrier.
#   cpa-heartbeat-timeout: 3s
#   cpa-cancel-bound: 5s
#   reclaim-grace: 5s
#   cleanup-interval: 5s
#   release-flush-interval: 250ms
#   release-max-backoff: 2s
#   busy-retry-min: 250ms
#   busy-retry-max: 1s
#   max-limit: 1000000
# Default bounds for publishing credential observation to Home.
# credential-in-flight:
#   snapshot-interval: 2s
#   stale-after: 10s
#   max-part-bytes: 262144
#   max-part-count: 64
#   max-revision-bytes: 16777216
#   max-aggregate-groups: 100000
#   max-details: 10000 # Set 0 to publish aggregate groups without details.
#   max-string-bytes: 256
#   staging-retention: 1m

# Quota exceeded behavior
quota-exceeded:
    # Legacy settings retained for compatibility. Current routing ignores both values.
    switch-project: true
    switch-preview-model: true
    # Whether to retry Claude Antigravity requests with Google One AI credits when quota is exceeded
    antigravity-credits: false
# Routing strategy for selecting credentials when multiple match.
routing:
    strategy: "round-robin" # round-robin (default), weighted-round-robin, quota-aware, fill-first
    # Keep requests from the same explicit or inferred session on one credential.
    # 旧 claude-code-session-affinity 在读取时迁移，新键显式值优先，成功保存后移除旧键
    session-affinity: false
    # Expire inactive session bindings after this duration.
    session-affinity-ttl: "1h"
    # Subagents inherit the parent credential by default across Claude, Codex, Antigravity, Gemini,
    # and generic harnesses.
    # Set false to distribute subagents through the configured fallback strategy.
    # Ignored when session-affinity is false.
    session-affinity-subagents: true
# CORS allowed origins. Empty allows all origins (*). To restrict access, list origins such as http://localhost:5173.
cors-allowed-origins: [ ]

# With ws-auth enabled, an AI Studio relay serves only requests authenticated with the same client key.
# With ws-auth disabled, registration and use of unauthenticated relays are limited to direct loopback clients.
ws-auth: true
# Allow API key authentication via URL query parameters (?key= or ?auth_token=).
# Keep false to keep credentials out of request URLs, logs, and browser history.
allow-query-auth: false

# Auto-refresh interval (seconds) for the management panel when the browser window regains focus.
# Set to 0 to disable auto-refresh. Default: 3.
auto-refresh-interval: 3
# Interval (hours) for fetching the upstream model catalog.
# Set to 0 to disable periodic model refresh. Default: 3.
model-refresh-interval: 3
# When > 0, emit blank lines every N seconds for non-streaming responses to prevent idle timeouts.
nonstream-keepalive-interval: 0
# Base model used by the legacy hosted image_generation tool path for GPT Image 2 and 2.5 requests
# that are not proxied directly through the Images API. Defaults to the model ID "gpt-5.4-mini".
gpt-image-2-base-model: "gpt-5.4-mini"
# How long video IDs stay pinned to the credential that created them. Empty or invalid uses 3h.
video-result-auth-cache-ttl: "3h"
# Optional periodic quota polling; limits below are in seconds.
quota-refresh:
    enabled: false
    interval: 600
    max-interval: 1800
# Claude provider behavior.
claude:
    # Cool down only the rejected model on a shared 429. Default false cools the credential.
    model-level-cooling: false

# Codex provider behavior.
codex:
    # Remap Codex prompt_cache_key and client identity per selected auth when fill-first/session affinity is enabled.
    identity-confuse: false
    # Disable forcing the official Codex User-Agent and Originator headers on HTTP/SSE and WebSocket requests.
    disable-codex-cloaking: false
    # Optimize official Codex multi-agent v2 requests and collaboration tools.
    optimize-multi-agent-v2: false
    # Enable opt-in compatibility for orphan Codex delegation outputs.
    # Converts orphan function_call_output items from codex_app/create_thread and
    # codex_app/send_message_to_thread into standard user messages when the request
    # header contains X-Openai-Subagent: collab_spawn.
    orphan-delegation-compatibility: false
    # Optional in-process WebRTC gateway for Codex Live audio and oai-events.
    live-media-relay:
        enabled: false
        # Maximum concurrent media sessions. 0 uses 32; enabled relays require a nonnegative value.
        max-sessions: 32
        # Reject private, loopback, link-local, multicast, and unspecified downstream candidates.
        # Leave false for local or LAN clients. Use only this key or the legacy inverse allow-private-remote-ips.
        disable-private-remote-ips: false
        # Public address announced by host candidates when CPA is behind NAT.
        public-ip: ""
        # Set both values to reserve a UDP range. The range needs at least two ports per session.
        udp-port-min: 0
        udp-port-max: 0
        # Without a concrete global or per-auth proxy-url, WebRTC uses direct ICE/STUN/TURN connectivity.
        # With http, https, socks5, or socks5h proxy-url, the OpenAI-facing leg uses authenticated
        # ICE-TCP through that proxy and does not fall back to UDP or a direct connection.
        # The Codex Desktop-facing leg remains direct, and configured ICE servers still apply to it.
        ice-servers: [ ]
        # Example TURN server:
        # ice-servers:
        #     - urls: ["turn:turn.example.invalid:3478?transport=udp"]
        #       username: ""    # Fill for authenticated TURN.
        #       credential: ""  # Fill for authenticated TURN.
# Structured form for client keys. Use an existing key, and keep provider API keys in their own sections.
# auth:
#   providers:
#     config-api-key:
#       api-key-entries:
#         - api-key: "<client-key>"
# off/all/chat/passthrough
disable-image-generation: "off"
redis-usage-queue-retention-seconds: 60

# Streaming defaults: no SSE heartbeats and no retries before the first response byte.
streaming:
    keepalive-seconds: 0
    bootstrap-retries: 0

# Provider examples stay inactive until you add a credential or an endpoint that supports anonymous access.
# Each provider row has priority (default 0; higher is preferred). Put weight on the credential itself
# (on api-key-entries for OpenAI providers). Omission uses weight 1; 0 excludes it from weighted selection.
# Omit proxy-url to inherit the global proxy, or use "direct" for no proxy.
# Omit disable-cooling and request-retry to inherit the global values; false and 0 are explicit overrides.
# Under models, use name for the upstream ID and alias for the client name. Omit display-name and
# max-context-length to retain model metadata where those options are supported. force-mapping and
# is-compat default to false where supported. Omit thinking to retain the model's own capabilities.
# An explicit thinking override uses levels, or min/max token budgets with zero-allowed and dynamic-allowed.
# Omitted flags in a thinking override default to false.

# Gemini API keys
# gemini-api-key:
#   - api-key: "<provider-api-key>"
#     priority: 0
#     weight: null # Use the default weight of 1 without setting an override.
#     prefix: "test" # optional: require calls like "test/gemini-3-pro-preview" to target this credential
#     request-retry: null # Inherit the global retry count.
#     disable-cooling: null # Inherit global cooldown scheduling.
#     base-url: "" # Empty uses https://generativelanguage.googleapis.com.
#     headers:
#       X-Custom-Header: "custom-value"
#     proxy-url: "socks5://proxy.example.com:1080"
#     request-scoped-errors: # optional: ordered upstream status/body rules; actions are documented below
#       - status: 400
#         match: ["maximum_context_length"]
#         match-regexr: ["^context_length_exceeded"]
#         action: "stop"
#     models:
#       - name: "gemini-2.5-flash" # upstream model name
#         alias: "gemini-flash"    # client alias mapped to the upstream model
#         display-name: ""       # Keep the model's display name when unset.
#         force-mapping: false    # Set true to rewrite response model fields to the alias.
#         max-context-length: 0   # 0 keeps the model's context window metadata.
#         is-compat: false        # Preserve compatibility-only thinking fields when true.
#         thinking:               # Optional override for budget-based models.
#           min: 0
#           max: 32768
#           zero-allowed: true
#           dynamic-allowed: true
#     excluded-models:
#       - "gemini-2.5-pro"     # exclude specific models from this provider (exact match)
#       - "gemini-2.5-*"       # wildcard matching prefix (e.g. gemini-2.5-flash, gemini-2.5-pro)
#       - "*-preview"          # wildcard matching suffix (e.g. gemini-3-pro-preview)
#       - "*flash*"            # wildcard matching substring (e.g. gemini-2.5-flash-lite)

# Native Interactions API keys
# These keys use the direct /v1beta/interactions endpoint.
# interactions-api-key:
#   - api-key: "<provider-api-key>"
#     prefix: "native" # optional: require calls like "native/gemini-2.5-flash" to target this credential
#     request-retry: null # Inherit the global retry count.
#     disable-cooling: null # Inherit global cooldown scheduling.
#     base-url: "" # Empty uses https://generativelanguage.googleapis.com.
#     headers:
#       X-Custom-Header: "custom-value"
#     proxy-url: "socks5://proxy.example.com:1080"
