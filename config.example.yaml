#         is-compat: false # optional: preserve compatibility-only thinking fields for compatible upstreams
#         thinking: # optional: exact thinking capability for this configured model
#           levels: ["high", "medium", "low", "none", "auto"]
#     excluded-models:
#       - "gemini-2.5-pro"

# Codex API keys
# codex-api-key:
#   - api-key: "<provider-api-key>"
#     prefix: "test" # optional: require calls like "test/gpt-5-codex" to target this credential
#     request-retry: null # Inherit the global retry count.
#     disable-cooling: null # Inherit global cooldown scheduling.
#     base-url: "https://codex.example.invalid" # Required for Codex API keys.
#     websockets: false # Enable upstream Responses WebSockets explicitly.
#     disable-codex-cloaking: null # Inherit codex.disable-codex-cloaking.
#     alpha-search: false # optional: allow this key to serve /v1/alpha/search via base-url + /alpha/search
