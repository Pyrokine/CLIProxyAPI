# Server host/interface to bind to. Default is "127.0.0.1" for local-only access.
# Use "0.0.0.0" to bind all IPv4 interfaces if remote access is needed.
host: "127.0.0.1"
# Server port
port: 8317
# TLS settings for HTTPS. When enabled, the server listens with the provided certificate and key.
tls:
    enable: false
    cert: ""
    key: ""
    # Reject plaintext requests to authenticated HTTP endpoints and Redis usage output.
    # Loopback clients remain allowed.
    require-for-auth: false
    # Only enable when CPA sits behind a trusted reverse proxy that terminates TLS.
    # If enabled while CPA is exposed directly, an attacker can forge X-Forwarded-Proto:
    # https and bypass require-for-auth. Default: false (only trust real TLS connections).
    trust-forwarded-proto: false
# Management API settings
remote-management:
    # Whether to allow remote (non-localhost) management access.
    # When false, only localhost can access management endpoints (a key is still required).
    allow-remote: false
    # Direct reverse-proxy IP addresses or CIDR ranges whose X-Forwarded-For/X-Real-IP
    # headers may identify management clients. Leave empty when CPA is exposed directly.
    # Example for a local Nginx proxy: ["127.0.0.1/32", "::1/128"]
    trusted-proxies: []
    # Management key. If a plaintext value is provided here, it will be hashed on startup.
    # All management requests (even from localhost) require this key.
    # Leave empty to disable the Management API entirely (404 for all /v0/management routes).
    secret-key: ""
    # Disable the bundled management control panel asset download and HTTP route when true.
    disable-control-panel: false
    # Disable automatic management panel asset updates while keeping the panel route enabled.
    disable-auto-update-panel: false
    # GitHub repository for the management control panel. Accepts a repository URL or releases API URL.
    panel-github-repository: "https://github.com/Pyrokine/Cli-Proxy-API-Management-Center"
    # GitHub repository for CPA backend releases.
    cpa-github-repository: "https://github.com/Pyrokine/CLIProxyAPI"
    # Periodically check GitHub for newer panel/backend releases.
    auto-check-update: false
    # Automatically install the CPA backend when auto-check-update finds a newer release.
    auto-update-cpa: false
    # Automatic update check interval in minutes.
    check-interval: 180
# Override management panel static directory with MANAGEMENT_STATIC_PATH environment variable.
# If set, the server will look for management.html in the specified path instead of the default location.
# Example: MANAGEMENT_STATIC_PATH=/opt/cpa/static
# Authentication directory (supports ~ for home directory)
auth-dir: "~/.cli-proxy-api"
# API keys for authentication
api-keys:
    - "your-api-key-1"
    - "your-api-key-2"
    - "your-api-key-3"
# Per-client API key model denylist. Omit a key to allow all models.
api-key-rules:
    "your-api-key-2":
        blocked-models:
            - "claude-opus-*"
            - "gpt-5.5"
# Enable debug logging
debug: false
# Enable pprof HTTP debug server (host:port). Keep it bound to localhost for safety.
pprof:
    enable: false
    addr: "127.0.0.1:8316"
# Standard dynamic library plugins are trusted in-process code. They are disabled by default.
# Build Go examples with go build -buildmode=c-shared for the target GOOS/GOARCH.
# Other languages can implement the same C ABI and JSON method protocol.
# Plugin executors require a matching auth record with the same provider key.
# If the same provider is configured as OpenAI-compatible, the native executor wins.
# Plugin command-line flags and Management API routes are optional capabilities.
# The plugin list Management API reads plugin Metadata Logo and ConfigFields for panel display.
# Per-plugin enabled only controls plugins.configs.<pluginID>.enabled; it does not change global plugins.enabled.
plugins:
    enabled: false
    dir: "plugins"
    # Additional plugin store registry URLs are appended after the built-in official source.
    # store-sources:
    #     - "https://example.com/cpa-plugin-registry.json"
    # Optional auth rules for private registry, metadata, and artifact URLs. Values are read from environment variables.
    # store-auth:
    #     - match: "https://api.github.com/repos/example/private-plugin/"
    #       apply-to: ["metadata"]
    #       type: "github-token"
    #       token-env: "CPA_PLUGIN_STORE_GITHUB_TOKEN"
    configs:
        example:
            enabled: true
            priority: 1
            config1: true
            config2: "string"
            config3: 3
            mode: "safe" # enum example: safe, fast
# When true, disable high-overhead HTTP middleware features to reduce per-request memory usage under high concurrency.
commercial-mode: false
# When true, disable Claude Code cloak mode globally for all Claude credentials.
disable-claude-cloak-mode: false
# When true, write application logs to rotating files instead of stdout
logging-to-file: false
# Maximum total size (MB) of log files under the logs directory. When exceeded, the oldest log
# files are deleted until within the limit. Set to 0 to disable.
logs-max-total-size-mb: 0
# Maximum number of error log files retained when request logging is disabled.
# When exceeded, the oldest error log files are deleted. Default is 10. Set to 0 to disable cleanup.
error-logs-max-files: 10
# When false, disable in-memory usage statistics aggregation
usage-statistics-enabled: false
# File path for persisting usage statistics across restarts.
# Defaults to "usage-statistics.json" next to config.yaml. Set to "disabled" to turn off.
# usage-statistics-file: ""

# Retention policy for detailed usage records (logrotate-style).
# Only per-request Details are trimmed; aggregate counters are preserved forever.
# usage-retention:
#   days: 30                    # Keep details for this many days. Older entries are removed. Set to -1 to disable cleanup.
#   max-db-size-mb: 1024        # Hard cap for events.db + WAL + SHM combined. Set to 0 to disable.
#   warning-threshold-pct: 80   # Show warnings when the DB reaches this percentage of max-db-size-mb.

# Proxy URL. Supports socks5/http/https protocols. Example: socks5://user:pass@192.168.1.1:1080/
proxy-url: ""
# When true, unprefixed model requests only use credentials without a prefix (except when prefix == model name).
force-model-prefix: false
# When true, enable Gemini CLI internal endpoints (/v1internal:*).
# Default is false for safety.
enable-gemini-cli-endpoint: false
# When true, forward filtered upstream response headers to downstream clients.
# Default is false (disabled).
passthrough-headers: false
# Number of times to retry a request. Retries will occur if the HTTP response code is 403, 408, 500, 502, 503, or 504.
request-retry: 3
# Maximum number of different credentials to try for one failed request.
# Set to 0 to keep legacy behavior (try all available credentials).
max-retry-credentials: 0
# Maximum wait time in seconds for a cooled-down credential before triggering a retry.
max-retry-interval: 30
# Number of concurrent OAuth auth refresh workers. When <= 0, the default is 16.
# auth-auto-refresh-workers: 16
# Quota exceeded behavior
quota-exceeded:
    switch-project: true # Whether to automatically switch to another project when a quota is exceeded
    switch-preview-model: true # Whether to automatically switch to a preview model when a quota is exceeded
    antigravity-credits: false # Whether to retry Claude Antigravity requests with Google One AI credits when quota is exceeded
# Routing strategy for selecting credentials when multiple match.
routing:
    strategy: "round-robin" # round-robin (default), fill-first
# CORS allowed origins. Empty = allow all (*) for CLI tool compatibility.
# Set to restrict browser access: ["http://localhost:5173", "http://127.0.0.1:5173"]
# cors-allowed-origins: []

# When true (default), enable authentication for the WebSocket API (/v1/ws).
# Set to false to disable (NOT RECOMMENDED — unauthenticated WebSocket access allows anonymous AI proxy usage).
ws-auth: true
# Allow API key authentication via URL query parameters (?key= / ?auth_token=).
# Disabled by default — query parameters leak credentials to server logs, Referer headers, and browser history.
# allow-query-auth: false

# Auto-refresh interval (seconds) for the management panel when the browser window regains focus.
# Set to 0 to disable auto-refresh. Default: 3.
auto-refresh-interval: 3
# Interval (hours) for fetching the upstream model catalog.
# Set to 0 to disable periodic model refresh. Default: 3.
model-refresh-interval: 3
# When > 0, emit blank lines every N seconds for non-streaming responses to prevent idle timeouts.
nonstream-keepalive-interval: 0
# Base model used by the legacy hosted image_generation tool path when Codex image requests are not proxied directly through the Image API. Defaults to gpt-5.4-mini.
# gpt-image-2-base-model: "gpt-5.4-mini"
# How long video IDs stay pinned to the credential that created them. Accepts duration strings like "30m" or "3h". Defaults to 3h.
# video-result-auth-cache-ttl: "3h"
quota-refresh:
    interval: 600
    max-interval: 1800
# Codex provider behavior.
codex:
    # Remap Codex prompt_cache_key and client identity per selected auth when fill-first/session affinity is enabled.
    identity-confuse: false
auth:
    providers:
        config-api-key:
            api-key-entries:
                -   api-key: your-api-key-1
                -   api-key: your-api-key-2
                -   api-key: your-api-key-3
# off/all/chat/passthrough
disable-image-generation: "off"
redis-usage-queue-retention-seconds: 60

# Streaming behavior (SSE keep-alives + safe bootstrap retries).
# streaming:
#   keepalive-seconds: 15   # Default: 0 (disabled). <= 0 disables keep-alives.
#   bootstrap-retries: 1    # Default: 0 (disabled). Retries before first byte is sent.

