#     prefix: "test" # optional: require calls like "test/kimi-k2" to target this provider's credentials
#     base-url: "https://openrouter.ai/api/v1" # The base URL of the provider.
#     support-prompt-cache-key: false # Derive prompt_cache_key for requests with session identity when true.
#     disabled: false # When true, exclude this provider from routing.
#     priority: 0
#     request-retry: null # Inherit the global retry count.
#     disable-cooling: null # Inherit global cooldown scheduling.
#     request-scoped-errors:
#       - status: 422
#         match: ["invalid_prompt"]
#         action: "continue"
#     headers:
#       X-Custom-Header: "custom-value"
#     api-key-entries: # Omit for an endpoint that accepts requests without a key.
#       - api-key: "<provider-api-key>"
#         disabled: false # When true, exclude this credential without changing its routing weight.
#         weight: null    # Uses 1 in weighted routing; 0 excludes this credential from weighted selection.
#         proxy-url: "" # Inherit the global proxy.
#     models: # The models supported by the provider.
#       - name: "moonshotai/kimi-k2:free" # The actual model name.
